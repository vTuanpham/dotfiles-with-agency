<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">A finished background task wakes the idle Codex conversation</title>
  <desc id="desc">A background command or native subagent runs inside Codex's command sandbox. A host hook registers its work with an observer, which delivers the result when the conversation is idle. codex-wake monitor runs a condition probe and sends matching events through the same observer.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker></defs>
  <rect width="1040" height="430" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="38" font-size="11" letter-spacing="2.4" fill="#68766f">CODEX-WAKE</text>
    <text x="36" y="78" font-family="Georgia, serif" font-size="30">End your turn. The result comes back.</text>
    <rect x="36" y="112" width="200" height="76" rx="13" fill="#f1ece4"/>
    <text x="136" y="144" text-anchor="middle" font-size="17" font-weight="700">Background command</text>
    <text x="136" y="166" text-anchor="middle" font-size="12" fill="#68766f">or native subagent · sandboxed</text>
    <path d="M236 150H296" stroke="#a4ada7" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <rect x="300" y="112" width="200" height="76" rx="13" fill="#eaf0eb"/>
    <text x="400" y="144" text-anchor="middle" font-size="17" font-weight="700">Stop hook</text>
    <text x="400" y="166" text-anchor="middle" font-size="12" fill="#56675d">host side · outside the sandbox</text>
    <path d="M500 150H560" stroke="#a4ada7" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <rect x="564" y="112" width="200" height="76" rx="13" fill="#eaf0eb"/>
    <text x="664" y="144" text-anchor="middle" font-size="17" font-weight="700">Observer</text>
    <text x="664" y="166" text-anchor="middle" font-size="12" fill="#56675d">waits until the session is idle</text>
    <path d="M764 150H824" stroke="#a4ada7" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <rect x="828" y="112" width="176" height="76" rx="13" fill="#e3ebf4"/>
    <text x="916" y="144" text-anchor="middle" font-size="17" font-weight="700">Conversation</text>
    <text x="916" y="166" text-anchor="middle" font-size="12" fill="#4f6580">wakes, once, with the result</text>
    <path d="M36 226H1004" stroke="#d3d8d1"/>
    <rect x="36" y="252" width="200" height="76" rx="13" fill="#f1ece4"/>
    <text x="136" y="284" text-anchor="middle" font-size="17" font-weight="700" font-family="monospace">codex-wake monitor</text>
    <text x="136" y="306" text-anchor="middle" font-size="12" fill="#68766f">probe every 10 s · sandboxed</text>
    <path d="M236 290H296" stroke="#a4ada7" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <rect x="300" y="252" width="200" height="76" rx="13" fill="#f1ece4"/>
    <text x="400" y="284" text-anchor="middle" font-size="17" font-weight="700" font-family="monospace">wake-event:</text>
    <text x="400" y="306" text-anchor="middle" font-size="12" fill="#68766f">one line per hit it announces</text>
    <path d="M500 290H664V192" stroke="#a4ada7" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <text x="700" y="268" font-size="15" font-weight="700">Condition events</text>
    <text x="700" y="292" font-size="12.5" fill="#68766f">A file appears, a service starts, a check passes</text>
    <text x="700" y="312" font-size="12.5" fill="#68766f">The observer delivers each report when Codex is idle</text>
    <text x="36" y="397" font-size="12" fill="#68766f">Bridge workers use Agent Bridge's own event delivery.</text>
  </g>
</svg>

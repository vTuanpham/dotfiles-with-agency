<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
  <title id="title">Agent Bridge jobs and direct native session messages</title>
  <desc id="desc">The root delegates to workers in other harnesses. Persistent jobs retain logs, messages and results for review. Direct messaging connects existing Codex, Claude Code, Antigravity and OpenCode sessions through their native APIs.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#737f7c" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1040" height="610" fill="#faf9f6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#263733">
    <text x="36" y="37" font-size="11" letter-spacing="2.4" fill="#68766f">AGENT BRIDGE</text>
    <text x="36" y="75" font-family="Georgia, serif" font-size="30">Delegate work. Message existing sessions.</text>
    <text x="36" y="207" font-size="23" font-weight="700">Root agent</text>
    <text x="36" y="233" font-size="14" fill="#68766f">Brief · steer · resume</text>
    <path d="M196 201H276M276 135V279M276 135H370M276 183H370M276 231H370M276 279H370" fill="none" stroke="#a4ada7" stroke-width="1.4"/>
    <path d="M348 135H370" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M348 183H370" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M348 231H370" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M348 279H370" fill="none" stroke="#737f7c" stroke-width="1.4" marker-end="url(#arrow)"/>
    <circle cx="397" cy="135" r="4" fill="#23786f"/>
    <text x="416" y="142" font-size="20" font-weight="700">Codex</text>
    <text x="610" y="142" font-size="14" fill="#68766f">Implementation</text>
    <circle cx="397" cy="183" r="4" fill="#a35e43"/>
    <text x="416" y="190" font-size="20" font-weight="700">Claude Code</text>
    <text x="610" y="190" font-size="14" fill="#68766f">UI / writing</text>
    <circle cx="397" cy="231" r="4" fill="#506b90"/>
    <text x="416" y="238" font-size="20" font-weight="700">Antigravity</text>
    <text x="610" y="238" font-size="14" fill="#68766f">Research</text>
    <circle cx="397" cy="279" r="4" fill="#65598a"/>
    <text x="416" y="286" font-size="20" font-weight="700">OpenCode</text>
    <text x="610" y="286" font-size="14" fill="#68766f">Review</text>
    <path d="M752 135H787V279H752" fill="none" stroke="#a4ada7" stroke-width="1.4"/>
    <path d="M787 207H825" fill="none" stroke="#a4ada7" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="847" y="196" font-size="19" font-weight="700">Job state</text>
    <text x="847" y="220" font-size="13" fill="#68766f">Logs · messages</text>
    <text x="847" y="241" font-size="13" fill="#68766f">Results · session</text>
    <path d="M911 257V330H94V249" fill="none" stroke="#a4ada7" stroke-width="1.3" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
    <text x="501" y="354" text-anchor="middle" font-size="13" fill="#68766f">The root reads progress, handles blockers and verifies the result.</text>
    <text x="36" y="380" font-size="11" letter-spacing="1.1" fill="#68766f">JOBS PERSIST BETWEEN TURNS</text>
    <path d="M36 405H1004" stroke="#d3d8d1"/>
    <text x="36" y="432" font-size="11" letter-spacing="2" fill="#68766f">DIRECT SESSION MESSAGES</text>
    <text x="36" y="470" font-size="21" font-weight="700">Existing session</text>
    <text x="36" y="496" font-size="13" fill="#68766f">Exact native sender</text>
    <path d="M230 477H370" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="388" y="449" width="264" height="71" rx="13" fill="#eaf0eb"/>
    <text x="520" y="478" text-anchor="middle" font-size="19" font-weight="700">Native agent messages</text>
    <text x="520" y="502" text-anchor="middle" font-size="13" fill="#56675d">Steer where supported</text>
    <path d="M670 477H792" fill="none" stroke="#737f7c" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="814" y="470" font-size="21" font-weight="700">Existing session</text>
    <text x="814" y="496" font-size="13" fill="#68766f">Exact native recipient</text>
    <text x="520" y="550" text-anchor="middle" font-size="14" fill="#68766f">Codex · Claude Code · agy · OpenCode</text>
    <text x="36" y="583" font-size="13" fill="#68766f">Direct messages use the recipient's native session API.</text>
  </g>
</svg>

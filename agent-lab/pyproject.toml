[project]
name = "agent-lab"
version = "0.1.0"
description = "Persistent experiment workspaces with provenance and safe retirement"
requires-python = ">=3.11,<3.15"
dependencies = ["agent-session==0.1.0"]

[tool.uv.sources]
agent-session = { path = "../agent-session", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent-lab = "agent_lab.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "ty==0.0.94"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
